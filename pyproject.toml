[project]
name = "retailpulse-ai-analyst"
version = "0.3.0"
description = "Grounded AI retail analytics copilot backed by a PySpark lakehouse."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
    "openai>=1.68.0,<3.0.0",
    "prometheus-client>=0.21.0,<1.0.0",
]

[project.optional-dependencies]
data = [
    "pyspark>=3.5.0,<4.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0,<3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0,<1.0.0",
    "ruff>=0.9.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
