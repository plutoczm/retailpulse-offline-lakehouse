name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: retailpulse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-quality:
    name: AI service quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-dev.txt

      - name: Install AI service dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt -r requirements-dev.txt

      - name: Lint AI application
        run: make lint

      - name: Run AI service tests
        run: make test-api

      - name: Run retrieval eval gate
        run: python scripts/run_ai_evals.py --threshold 0.95

      - name: Run tool-routing eval gate
        run: python scripts/run_tool_evals.py --threshold 0.95

  container-smoke:
    name: Container packaging smoke test
    runs-on: ubuntu-latest
    needs: app-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t retailpulse-ai:test .

      - name: Start container
        run: docker run -d --name retailpulse-ai -p 8000:8000 retailpulse-ai:test

      - name: Verify packaged analytics agent
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          for _ in range(30):
              try:
                  urllib.request.urlopen("http://127.0.0.1:8000/readyz", timeout=2).read()
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit("container never became ready")

          payload = json.dumps(
              {"question": "销售额最高的 Top3 商品是什么？", "top_k": 3}
          ).encode()
          request = urllib.request.Request(
              "http://127.0.0.1:8000/api/v1/ask",
              data=payload,
              headers={"Content-Type": "application/json"},
          )
          body = json.loads(urllib.request.urlopen(request, timeout=5).read())
          assert body["analysis"]["summary"]
          assert body["data_version"]
          assert any(call["tool"] == "get_topn" for call in body["plan"]["calls"])
          assert any(result["tool"] == "get_topn" for result in body["tool_results"])
          PY

      - name: Print container logs
        if: always()
        run: docker logs retailpulse-ai || true

  pipeline-smoke:
    name: Lakehouse quality and smoke test
    runs-on: ubuntu-latest
    needs: app-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-data.txt
            requirements-dev.txt

      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-data.txt -r requirements-dev.txt

      - name: Run data unit tests
        run: make test-data

      - name: Run tiny pipeline with quality gate
        run: >-
          python scripts/run_all.py
          --scale tiny
          --start-date 2025-01-01
          --days 3
          --data-root .ci-data

      - name: Upload data quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: reports/data_quality_report.md
          if-no-files-found: warn
