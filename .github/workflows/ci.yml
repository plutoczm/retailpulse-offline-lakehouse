name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: retailpulse-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-quality:
    name: AI app quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            requirements-data.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint AI application
        run: make lint

      - name: Run unit tests
        run: pytest

      - name: Run retrieval eval gate
        run: python scripts/run_ai_evals.py --threshold 0.95

  pipeline-smoke:
    name: Tiny lakehouse smoke test
    runs-on: ubuntu-latest
    needs: app-quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-data.txt

      - name: Install data dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-data.txt

      - name: Run tiny pipeline with quality gate
        run: >-
          python scripts/run_all.py
          --scale tiny
          --start-date 2025-01-01
          --days 3
          --data-root .ci-data

      - name: Upload data quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: reports/data_quality_report.md
          if-no-files-found: warn
