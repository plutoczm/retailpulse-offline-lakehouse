name: Provider resilience
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  circuit-breaker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-api.txt -r requirements-dev.txt
      - run: pytest -q tests/test_provider_circuit.py
