services:
  spark-master:
    image: bitnami/spark:3.5
    container_name: retailpulse-spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./:/opt/retailpulse

  spark-worker:
    image: bitnami/spark:3.5
    container_name: retailpulse-spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./:/opt/retailpulse

  postgres:
    image: postgres:16
    container_name: retailpulse-postgres
    environment:
      POSTGRES_USER: retailpulse
      POSTGRES_PASSWORD: retailpulse
      POSTGRES_DB: retailpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: retailpulse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:

